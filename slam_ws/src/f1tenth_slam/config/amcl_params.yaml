# Nav2 AMCL params for F1TENTH localization.
#
# What runs:
#   map_server          — publishes /map from /home/carver/carver_f1tenth/map/my_map.yaml
#   amcl                — particle filter; publishes map→odom TF
#   lifecycle_manager   — configures + activates both above
#
# Topics in:   /scan (10 Hz, frame=laser),  /tf (odom→base via EKF)
# Topics out:  /tf (map→odom),  /particle_cloud,  /amcl_pose

amcl:
  ros__parameters:
    use_sim_time: false

    # --- frames ---
    # Our EKF / SLAM stack already uses 'basefootprint' (one word, no
    # underscore) as the planar base frame — keep AMCL consistent.
    base_frame_id: basefootprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # --- motion model ---
    # No Ackermann model in Nav2 AMCL; Differential is the closest fit for
    # rear-wheel-drive Ackermann at low indoor speed and works well in
    # practice (alphas tune how much trust to give odom translation/rotation).
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Bumped from the textbook 0.2 to compensate for: (a) Ackermann steered
    # via DifferentialMotionModel — rotation/translation coupling isn't
    # exact, and (b) IMU-driven EKF still has noisier odom than wheel
    # encoders. Wider noise per update lets the filter not over-commit.
    alpha1: 0.5     # rot noise from rot
    alpha2: 0.5     # rot noise from trans
    alpha3: 0.5     # trans noise from trans
    alpha4: 0.5     # trans noise from rot
    alpha5: 0.2     # strafe (unused for diff)

    # --- laser model (RPLidar C1) ---
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60                          # subsample 60 of ~500 rays — plenty
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # --- particle filter ---
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # F1TENTH at indoor speed moves cm at a time — defaults of 0.25 m /
    # 0.2 rad were way too coarse and made the pose lag noticeably.
    update_min_a: 0.05                     # rad
    update_min_d: 0.05                     # m

    # --- TF ---
    tf_broadcast: true                     # publish map→odom
    transform_tolerance: 1.0
    save_pose_rate: 0.5                    # Hz

    # --- initial pose ---
    # Pre-seed at the saved-map origin. Override at runtime with the
    # "2D Pose Estimate" tool in RViz (publishes /initialpose).
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    always_reset_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/carver/carver_f1tenth/map/my_map.yaml
    topic_name: map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0                      # don't shutdown if a node disappears
    node_names: ["map_server", "amcl"]
